name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate package and checksums
        run: python -B validation/validate_package.py
      - name: Test evaluator
        run: python -B -m unittest discover -s evaluation -p test_eval_suite.py -v
      - name: Exercise baseline and reference fixtures
        run: python -B evaluation/eval_suite.py self-test
      - name: Test non-overwriting installer
        run: python -B -m unittest discover -s tests -v
      - name: Check whitespace
        run: git show --format= --check HEAD
